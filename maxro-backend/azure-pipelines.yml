trigger:
  branches:
    include:
      - main
  paths:
    include:
      - maxro-backend/**

pool:
  name: 'Default'

variables:
  - group: maxro-secrets
  - name: AZURE_SERVICE_CONNECTION
    value: 'maxro-azure-sc-v3'
  - name: ACR_NAME
    value: 'maxroacr8db8c'
  - name: RESOURCE_GROUP
    value: 'maxro-rg'
  - name: AZURE_LOCATION
    value: 'centralus'
  - name: CONTAINER_APP_ENVIRONMENT
    value: 'maxro-env'
  - name: CORS_ORIGINS
    value: 'https://gomaxro.com,https://www.gomaxro.com,https://yellow-bush-0621c1c10.7.azurestaticapps.net,http://localhost:4200,http://127.0.0.1:4200'
  - name: COSMOS_ACCOUNT_NAME
    value: 'maxrocosmos8db8c'
  - name: MONGO_DATABASE_NAME
    value: 'maxro'
  - name: imageName
    value: 'maxro-backend'
  - name: containerRegistry
    value: '$(ACR_NAME).azurecr.io'
  - name: containerAppName
    value: 'maxro-backend'
  - name: containerAppEnvironment
    value: 'maxro-env'
  - name: apiHostname
    value: 'api.gomaxro.com'
  - name: backendDefaultHostname
    value: 'maxro-backend.lemonwave-ad7f10c5.centralus.azurecontainerapps.io'
  - name: azureLocation
    value: 'centralus'
  - name: containerCpu
    value: '0.5'
  - name: containerMemory
    value: '1.0Gi'
  - name: javaToolOptions
    value: '-Xms32m -Xmx128m -XX:+UseSerialGC'
  - name: mavenOpts
    value: '-Xms128m -Xmx512m -XX:+UseSerialGC -Djava.awt.headless=true'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test Spring Boot'
        steps:
          - powershell: |
              $javaHomeCandidates = @(
                $env:JAVA_HOME_21_X64,
                'C:\Program Files\Eclipse Adoptium\jdk-21.0.10.7-hotspot',
                'C:\Program Files\Java\jdk-21'
              )

              $javaHome = $javaHomeCandidates |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path (Join-Path $_ 'bin\javac.exe')) } |
                Select-Object -First 1

              if ([string]::IsNullOrWhiteSpace($javaHome)) {
                $jdk21 = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files\Eclipse Adoptium' -Directory -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like 'jdk-21*' -and (Test-Path (Join-Path $_.FullName 'bin\javac.exe')) } |
                  Sort-Object FullName |
                  Select-Object -First 1
                if ($jdk21) {
                  $javaHome = $jdk21.FullName
                }
              }

              if ([string]::IsNullOrWhiteSpace($javaHome)) {
                $javac = (Get-Command javac -ErrorAction Stop).Source
                $javaHome = Split-Path (Split-Path $javac -Parent) -Parent
              }

              $javacVersion = & "$javaHome\bin\javac.exe" -version 2>&1
              if ($javacVersion -notmatch 'javac\s+2[1-9]\.') {
                throw "Java 21+ is required, but '$javaHome' reports '$javacVersion'."
              }

              Write-Host "Using JAVA_HOME=$javaHome"
              Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
              Write-Host "##vso[task.setvariable variable=JAVA_TOOL_OPTIONS]$(javaToolOptions)"
              Write-Host "##vso[task.setvariable variable=MAVEN_OPTS]$(mavenOpts)"
              Write-Host "##vso[task.prependpath]$javaHome\bin"
              $env:JAVA_TOOL_OPTIONS = '$(javaToolOptions)'
              & "$javaHome\bin\java.exe" -version
            displayName: 'Use Java 21 from agent'

          - script: 'cmd /c mvnw.cmd -B test -DforkCount=1 -DreuseForks=true -DargLine="-Xms64m -Xmx256m -XX:+UseSerialGC"'
            displayName: 'Run Tests'
            workingDirectory: 'maxro-backend'
            env:
              JAVA_HOME: $(JAVA_HOME)
              JAVA_TOOL_OPTIONS: $(JAVA_TOOL_OPTIONS)
              MAVEN_OPTS: $(MAVEN_OPTS)

          - task: PublishTestResults@2
            displayName: 'Publish JUnit Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'maxro-backend/**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true

          - script: cmd /c mvnw.cmd package -DskipTests
            displayName: 'Build JAR'
            workingDirectory: 'maxro-backend'
            env:
              JAVA_HOME: $(JAVA_HOME)
              JAVA_TOOL_OPTIONS: $(JAVA_TOOL_OPTIONS)
              MAVEN_OPTS: $(MAVEN_OPTS)

          - powershell: |
              $azureCliPath = 'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin'
              if (-not (Test-Path $azureCliPath)) {
                throw "Azure CLI path not found: $azureCliPath"
              }
              Write-Host "##vso[task.prependpath]$azureCliPath"
              & "$azureCliPath\az.cmd" version
            displayName: 'Expose Azure CLI on PATH'

          - task: AzureCLI@2
            displayName: 'Build and Push Image with Jib'
            inputs:
              azureSubscription: 'maxro-azure-sc-v3'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr update --name $(ACR_NAME) --admin-enabled true 1>$null
                $acrUsername = az acr credential show --name $(ACR_NAME) --query username -o tsv
                $acrPassword = az acr credential show --name $(ACR_NAME) --query "passwords[0].value" -o tsv

                if ([string]::IsNullOrWhiteSpace($acrUsername) -or [string]::IsNullOrWhiteSpace($acrPassword)) {
                  throw "Unable to resolve ACR admin credentials for $(ACR_NAME)"
                }

                Push-Location maxro-backend
                try {
                  & .\mvnw.cmd `
                    -B `
                    -DskipTests `
                    "-Djib.to.image=$(containerRegistry)/$(imageName)" `
                    "-Djib.to.tags=$(Build.BuildId),latest" `
                    "-Djib.to.auth.username=$acrUsername" `
                    "-Djib.to.auth.password=$acrPassword" `
                    jib:build

                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
                }
                finally {
                  Pop-Location
                }
            env:
              JAVA_HOME: $(JAVA_HOME)
              JAVA_TOOL_OPTIONS: $(JAVA_TOOL_OPTIONS)
              MAVEN_OPTS: $(MAVEN_OPTS)

  - stage: Deploy
    displayName: 'Deploy to Azure Container Apps'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployBackend
        displayName: 'Deploy Backend'
        steps:
          - powershell: |
              $azureCliPath = 'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin'
              if (-not (Test-Path $azureCliPath)) {
                throw "Azure CLI path not found: $azureCliPath"
              }
              Write-Host "##vso[task.prependpath]$azureCliPath"
              & "$azureCliPath\az.cmd" version
            displayName: 'Expose Azure CLI on PATH'

          - task: AzureCLI@2
            displayName: 'Deploy to Container Apps'
            inputs:
              azureSubscription: 'maxro-azure-sc-v3'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              failOnStandardError: false
              powerShellIgnoreLASTEXITCODE: true
              inlineScript: |
                function Add-SecretArg([string]$Key, [string]$Value) {
                  if (Test-ResolvedValue $Value) {
                    $script:secretArgs += "$Key=$Value"
                  }
                }

                function Add-EnvArg([string]$Key, [string]$Value) {
                  if (Test-ResolvedValue $Value) {
                    $script:envArgs += "$Key=$Value"
                  }
                }

                function Test-ResolvedValue([string]$Value) {
                  return -not ([string]::IsNullOrWhiteSpace($Value) -or $Value -match '^\$\(')
                }

                $location = if ($env:AZURE_LOCATION) { $env:AZURE_LOCATION } else { '$(azureLocation)' }
                $appEnvironment = if ($env:CONTAINER_APP_ENVIRONMENT) { $env:CONTAINER_APP_ENVIRONMENT } else { '$(containerAppEnvironment)' }
                $serverPortValue = if ($env:SERVER_PORT) { $env:SERVER_PORT } else { '8080' }
                $imageRef = "$(containerRegistry)/$(imageName):$(Build.BuildId)"

                Write-Host "Resolving Mongo URI from Cosmos account $(COSMOS_ACCOUNT_NAME)."
                $connectionStrings = az cosmosdb keys list `
                  --name $(COSMOS_ACCOUNT_NAME) `
                  --resource-group $(RESOURCE_GROUP) `
                  --type connection-strings -o json | ConvertFrom-Json
                $connectionString = ($connectionStrings.connectionStrings |
                  Where-Object { $_.description -match 'Primary.*MongoDB' } |
                  Select-Object -First 1).connectionString
                if ([string]::IsNullOrWhiteSpace($connectionString)) {
                  throw "Unable to resolve Mongo connection string for Cosmos account $(COSMOS_ACCOUNT_NAME)."
                }

                $mongoUri = ($connectionString -replace '/\?', '/$(MONGO_DATABASE_NAME)?') -split '&' | Select-Object -First 1
                if ($mongoUri -notmatch '^mongodb(\+srv)?:\/\/') {
                  throw "Resolved Mongo URI must start with mongodb:// or mongodb+srv://"
                }

                $existingEnv = az resource list `
                  --resource-group $(RESOURCE_GROUP) `
                  --resource-type Microsoft.App/managedEnvironments `
                  --query "[?name=='$appEnvironment'].name | [0]" -o tsv
                if ([string]::IsNullOrWhiteSpace($existingEnv)) {
                  az containerapp env create `
                    --name $appEnvironment `
                    --resource-group $(RESOURCE_GROUP) `
                    --location $location `
                    --logs-destination none
                }

                az acr update --name $(ACR_NAME) --admin-enabled true 1>$null
                $acrUsername = az acr credential show --name $(ACR_NAME) --query username -o tsv
                $acrPassword = az acr credential show --name $(ACR_NAME) --query "passwords[0].value" -o tsv

                $existingApp = az resource list `
                  --resource-group $(RESOURCE_GROUP) `
                  --resource-type Microsoft.App/containerApps `
                  --query "[?name=='$(containerAppName)'].name | [0]" -o tsv
                $existingSecretNames = @()
                if (-not [string]::IsNullOrWhiteSpace($existingApp)) {
                  $existingSecretNames = @(az containerapp secret list `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) -o json | ConvertFrom-Json | ForEach-Object { $_.name })
                }

                $jwtSecretValue = if (Test-ResolvedValue $env:JWT_SECRET) { $env:JWT_SECRET } else { '' }
                if (-not [string]::IsNullOrWhiteSpace($jwtSecretValue) -and $jwtSecretValue.Length -lt 32) {
                  throw "JWT_SECRET must be at least 32 characters for HS256. Current length: $($jwtSecretValue.Length)"
                }
                if ([string]::IsNullOrWhiteSpace($jwtSecretValue) -and $existingSecretNames -notcontains 'jwt-secret') {
                  throw "JWT_SECRET is not available from the pipeline and the container app does not already have a jwt-secret secret."
                }

                if ([string]::IsNullOrWhiteSpace($existingApp)) {
                  az containerapp create `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --environment $appEnvironment `
                    --image $imageRef `
                    --revision-suffix r$(Build.BuildId) `
                    --ingress external `
                    --target-port $serverPortValue `
                    --cpu $(containerCpu) `
                    --memory $(containerMemory) `
                    --min-replicas 1 `
                    --max-replicas 1 `
                    --registry-server $(containerRegistry) `
                    --registry-username $acrUsername `
                    --registry-password $acrPassword `
                    --env-vars `
                      SPRING_PROFILES_ACTIVE=prod `
                      SERVER_PORT=$serverPortValue `
                      APP_LOG_LEVEL=$(APP_LOG_LEVEL) `
                      GRAPHIQL_ENABLED=$(GRAPHIQL_ENABLED)
                }

                az containerapp registry set `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --server $(containerRegistry) `
                  --username $acrUsername `
                  --password $acrPassword

                $secretArgs = @()
                Add-SecretArg 'mongodb-uri' $mongoUri
                Add-SecretArg 'jwt-secret' $jwtSecretValue
                Add-SecretArg 'spotify-client-secret' $env:SPOTIFY_CLIENT_SECRET
                Add-SecretArg 'google-ai-api-key' $env:GOOGLE_AI_API_KEY
                Add-SecretArg 'usda-fooddata-api-key' $env:USDA_FOODDATA_API_KEY
                Add-SecretArg 'fatsecret-client-id' $env:FATSECRET_CLIENT_ID
                Add-SecretArg 'fatsecret-client-secret' $env:FATSECRET_CLIENT_SECRET

                if ($secretArgs.Count -gt 0) {
                  az containerapp secret set `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --secrets $secretArgs
                }

                $envArgs = @()
                Add-EnvArg 'SPRING_PROFILES_ACTIVE' 'prod'
                Add-EnvArg 'SERVER_PORT' $serverPortValue
                Add-EnvArg 'MAXRO_PR_CLEANUP_ENABLED' 'false'
                Add-EnvArg 'CORS_ORIGINS' $env:CORS_ORIGINS
                Add-EnvArg 'APP_LOG_LEVEL' '$(APP_LOG_LEVEL)'
                Add-EnvArg 'GRAPHIQL_ENABLED' '$(GRAPHIQL_ENABLED)'
                Add-EnvArg 'JWT_ACCESS_EXPIRATION' $env:JWT_ACCESS_EXPIRATION
                Add-EnvArg 'JWT_REFRESH_EXPIRATION' $env:JWT_REFRESH_EXPIRATION
                Add-EnvArg 'GOOGLE_CLIENT_ID' $env:GOOGLE_CLIENT_ID
                Add-EnvArg 'SPOTIFY_CLIENT_ID' $env:SPOTIFY_CLIENT_ID
                Add-EnvArg 'GOOGLE_AI_MODEL' $env:GOOGLE_AI_MODEL

                $envArgs += 'MONGODB_URI=secretref:mongodb-uri'
                $envArgs += 'SPRING_DATA_MONGODB_URI=secretref:mongodb-uri'
                $envArgs += 'JWT_SECRET=secretref:jwt-secret'
                if ((Test-ResolvedValue $env:SPOTIFY_CLIENT_SECRET) -or $existingSecretNames -contains 'spotify-client-secret') {
                  $envArgs += 'SPOTIFY_CLIENT_SECRET=secretref:spotify-client-secret'
                }
                if ((Test-ResolvedValue $env:GOOGLE_AI_API_KEY) -or $existingSecretNames -contains 'google-ai-api-key') {
                  $envArgs += 'GOOGLE_AI_API_KEY=secretref:google-ai-api-key'
                }
                if ((Test-ResolvedValue $env:USDA_FOODDATA_API_KEY) -or $existingSecretNames -contains 'usda-fooddata-api-key') {
                  $envArgs += 'USDA_FOODDATA_API_KEY=secretref:usda-fooddata-api-key'
                }
                if ((Test-ResolvedValue $env:FATSECRET_CLIENT_ID) -or $existingSecretNames -contains 'fatsecret-client-id') {
                  $envArgs += 'FATSECRET_CLIENT_ID=secretref:fatsecret-client-id'
                }
                if ((Test-ResolvedValue $env:FATSECRET_CLIENT_SECRET) -or $existingSecretNames -contains 'fatsecret-client-secret') {
                  $envArgs += 'FATSECRET_CLIENT_SECRET=secretref:fatsecret-client-secret'
                }

                if ($envArgs.Count -gt 0) {
                  az containerapp update `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --image $imageRef `
                    --revision-suffix r$(Build.BuildId) `
                    --cpu $(containerCpu) `
                    --memory $(containerMemory) `
                    --min-replicas 1 `
                    --max-replicas 1 `
                    --set-env-vars $envArgs
                } else {
                  az containerapp update `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --image $imageRef `
                    --revision-suffix r$(Build.BuildId) `
                    --cpu $(containerCpu) `
                    --memory $(containerMemory) `
                    --min-replicas 1 `
                    --max-replicas 1
                }

                # Keep rollout deterministic: only latest revision should be active and receive traffic.
                az containerapp revision set-mode `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --mode single

                az containerapp ingress traffic set `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --revision-weight latest=100
            env:
              MONGODB_URI: $(MONGODB_URI)
              JWT_SECRET: $(JWT_SECRET)
              JWT_ACCESS_EXPIRATION: $(JWT_ACCESS_EXPIRATION)
              JWT_REFRESH_EXPIRATION: $(JWT_REFRESH_EXPIRATION)
              GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
              GOOGLE_AI_API_KEY: $(GOOGLE_AI_API_KEY)
              GOOGLE_AI_MODEL: $(GOOGLE_AI_MODEL)
              SPOTIFY_CLIENT_ID: $(SPOTIFY_CLIENT_ID)
              SPOTIFY_CLIENT_SECRET: $(SPOTIFY_CLIENT_SECRET)
              USDA_FOODDATA_API_KEY: $(USDA_FOODDATA_API_KEY)
              FATSECRET_CLIENT_ID: $(FATSECRET_CLIENT_ID)
              FATSECRET_CLIENT_SECRET: $(FATSECRET_CLIENT_SECRET)
              CORS_ORIGINS: $(CORS_ORIGINS)
              SERVER_PORT: $(SERVER_PORT)
              APP_LOG_LEVEL: $(APP_LOG_LEVEL)
              GRAPHIQL_ENABLED: $(GRAPHIQL_ENABLED)
              AZURE_LOCATION: $(AZURE_LOCATION)
              CONTAINER_APP_ENVIRONMENT: $(CONTAINER_APP_ENVIRONMENT)
              API_HOSTNAME: $(apiHostname)

          - task: AzureCLI@2
            displayName: 'Bind API Custom Domain'
            inputs:
              azureSubscription: 'maxro-azure-sc-v3'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              failOnStandardError: false
              powerShellIgnoreLASTEXITCODE: true
              inlineScript: |
                $appEnvironment = if ($env:CONTAINER_APP_ENVIRONMENT) { $env:CONTAINER_APP_ENVIRONMENT } else { '$(containerAppEnvironment)' }
                $apiHostname = if ($env:API_HOSTNAME) { $env:API_HOSTNAME } else { '$(apiHostname)' }

                if ([string]::IsNullOrWhiteSpace($apiHostname)) {
                  Write-Host 'API custom-domain binding skipped because API_HOSTNAME is not set.'
                  exit 0
                }

                $backendHostname = az containerapp show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query properties.configuration.ingress.fqdn -o tsv
                $verificationId = az containerapp show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query properties.customDomainVerificationId -o tsv

                $currentCname = Resolve-DnsName $apiHostname -Type CNAME -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty NameHost
                $txtRecordName = "asuid.$apiHostname"
                $currentTxtValues = @(Resolve-DnsName $txtRecordName -Type TXT -ErrorAction SilentlyContinue |
                  ForEach-Object { ($_.Strings -join '') })

                if (
                  [string]::IsNullOrWhiteSpace($currentCname) -or
                  $currentCname.TrimEnd('.').ToLowerInvariant() -ne $backendHostname.TrimEnd('.').ToLowerInvariant() -or
                  $currentTxtValues -notcontains $verificationId
                ) {
                  Write-Host 'API custom-domain binding skipped because DNS is not cut over yet.'
                  Write-Host "Required CNAME: $apiHostname -> $backendHostname"
                  Write-Host "Current CNAME: $currentCname"
                  Write-Host "Required TXT: $txtRecordName -> $verificationId"
                  Write-Host "Current TXT: $($currentTxtValues -join ',')"
                  exit 0
                }

                $existingHostname = az containerapp hostname list `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query "[?name=='$apiHostname'].name | [0]" -o tsv

                if ([string]::IsNullOrWhiteSpace($existingHostname)) {
                  Write-Host "Adding hostname $apiHostname to $(containerAppName)"
                  az containerapp hostname add `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --hostname $apiHostname
                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to add hostname $apiHostname to $(containerAppName)."
                  }
                } else {
                  Write-Host "Hostname $apiHostname is already registered on $(containerAppName)"
                }

                $maxAttempts = 6
                $sleepSeconds = 20
                for ($i = 1; $i -le $maxAttempts; $i++) {
                  try {
                    Write-Host "Binding hostname attempt ${i}/${maxAttempts}"
                    az containerapp hostname bind `
                      --name $(containerAppName) `
                      --resource-group $(RESOURCE_GROUP) `
                      --environment $appEnvironment `
                      --hostname $apiHostname `
                      --validation-method CNAME
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to bind hostname $apiHostname to $(containerAppName)."
                    }
                    Write-Host 'API custom-domain binding succeeded.'
                    exit 0
                  } catch {
                    if ($i -eq $maxAttempts) {
                      throw
                    }

                    Write-Host "Bind attempt ${i} failed: $($_.Exception.Message)"
                    Start-Sleep -Seconds $sleepSeconds
                  }
                }
            env:
              CONTAINER_APP_ENVIRONMENT: $(CONTAINER_APP_ENVIRONMENT)
              API_HOSTNAME: $(apiHostname)


          - task: AzureCLI@2
            displayName: 'Health Check'
            inputs:
              azureSubscription: 'maxro-azure-sc-v3'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $expectedRevisionSuffix = "r$(Build.BuildId)"
                $maxAttempts = 12
                $sleepSeconds = 10

                for ($i = 1; $i -le $maxAttempts; $i++) {
                  $appJson = az containerapp show `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) -o json

                  $app = $appJson | ConvertFrom-Json
                  $runningStatus = $app.properties.runningStatus
                  $latestRevision = $app.properties.latestRevisionName
                  $latestReadyRevision = $app.properties.latestReadyRevisionName

                  $revisionsJson = az containerapp revision list `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) -o json
                  $revisions = $revisionsJson | ConvertFrom-Json
                  $expectedRevision = $revisions | Where-Object { $_.name -like "*--$expectedRevisionSuffix" } | Select-Object -First 1
                  $expectedRevisionName = if ($expectedRevision) { $expectedRevision.name } else { '' }
                  $expectedRevisionRunningState = if ($expectedRevision) { $expectedRevision.properties.runningState } else { '' }
                  $expectedRevisionHealthState = if ($expectedRevision) { $expectedRevision.properties.healthState } else { '' }

                  $targetRevisionName = if (-not [string]::IsNullOrWhiteSpace($expectedRevisionName)) { $expectedRevisionName } else { $latestRevision }
                  if ([string]::IsNullOrWhiteSpace($expectedRevisionName)) {
                    Write-Host "Expected revision suffix '$expectedRevisionSuffix' not found yet; falling back to latestRevision comparison."
                  }

                  Write-Host "Attempt ${i}: runningStatus=$runningStatus, latestRevision=$latestRevision, latestReadyRevision=$latestReadyRevision, expectedRevision=$expectedRevisionName, expectedRunningState=$expectedRevisionRunningState, expectedHealthState=$expectedRevisionHealthState, targetRevision=$targetRevisionName"

                  if (
                    $runningStatus -eq 'Running' -and
                    -not [string]::IsNullOrWhiteSpace($targetRevisionName) -and
                    $latestReadyRevision -eq $targetRevisionName
                  ) {
                    Write-Host 'Health check passed (target revision is ready).'
                    exit 0
                  }

                  if ($i -lt $maxAttempts) {
                    Start-Sleep -Seconds $sleepSeconds
                  }
                }

                Write-Host 'Health check failed (revision never became ready).'
                Write-Host 'Container app diagnostics:'

                az containerapp show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query "{runningStatus:properties.runningStatus,latestRevisionName:properties.latestRevisionName,latestReadyRevisionName:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn}" -o table

                Write-Host 'Latest revisions:'
                az containerapp revision list `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query "[].{name:name,active:properties.active,createdTime:properties.createdTime,runningState:properties.runningState,healthState:properties.healthState,replicas:properties.replicas}" -o table

                $latestRevisionForDiagnostics = az containerapp show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query properties.latestRevisionName -o tsv

                if (-not [string]::IsNullOrWhiteSpace($latestRevisionForDiagnostics)) {
                  Write-Host "Latest revision conditions ($latestRevisionForDiagnostics):"
                  az containerapp revision show `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --revision $latestRevisionForDiagnostics `
                    --query "properties.conditions[].{type:type,status:status,reason:reason,message:message}" -o table
                }

                Write-Host 'Recent app logs:'
                az containerapp logs show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --tail 100

                $failedRevisionName = az containerapp show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --query properties.latestRevisionName -o tsv

                if (-not [string]::IsNullOrWhiteSpace($failedRevisionName)) {
                  Write-Host "Recent app logs for failing latest revision ($failedRevisionName):"
                  az containerapp logs show `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --revision $failedRevisionName `
                    --type console `
                    --tail 200

                  Write-Host "Recent system logs for failing latest revision ($failedRevisionName):"
                  az containerapp logs show `
                    --name $(containerAppName) `
                    --resource-group $(RESOURCE_GROUP) `
                    --revision $failedRevisionName `
                    --type system `
                    --tail 200
                }

                Write-Host 'Recent system logs:'
                az containerapp logs show `
                  --name $(containerAppName) `
                  --resource-group $(RESOURCE_GROUP) `
                  --type system `
                  --tail 100

                exit 1

          - powershell: |
              $apiHostname = if ($env:API_HOSTNAME) { $env:API_HOSTNAME } else { '$(apiHostname)' }
              $expectedBackendHostname = if ($env:BACKEND_DEFAULT_HOSTNAME) { $env:BACKEND_DEFAULT_HOSTNAME } else { '$(backendDefaultHostname)' }
              if ([string]::IsNullOrWhiteSpace($apiHostname)) {
                Write-Host 'API hostname health check skipped because API_HOSTNAME is not set.'
                exit 0
              }

              $currentCname = Resolve-DnsName $apiHostname -Type CNAME -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty NameHost
              if (
                [string]::IsNullOrWhiteSpace($currentCname) -or
                $currentCname.TrimEnd('.').ToLowerInvariant() -ne $expectedBackendHostname.TrimEnd('.').ToLowerInvariant()
              ) {
                Write-Host "Branded API health check skipped because DNS is not cut over yet."
                Write-Host "Current CNAME: $currentCname"
                Write-Host "Expected CNAME: $expectedBackendHostname"
                exit 0
              }

              $healthUrl = "https://$apiHostname/actuator/health"
              Write-Host ("Checking branded API health at " + $healthUrl)

              for ($i = 1; $i -le 20; $i++) {
                try {
                  $response = Invoke-RestMethod -Uri $healthUrl -UseBasicParsing -TimeoutSec 20
                  if ($response.status -eq 'UP') {
                    Write-Host 'Branded API health check passed'
                    exit 0
                  }
                  $status = $response.status
                } catch {
                  $status = $_.Exception.Message
                }

                Write-Host ("Attempt " + $i + ": status " + $status + ', retrying...')
                Start-Sleep -Seconds 15
              }

              Write-Host 'Branded API health check failed'
              exit 1
            displayName: 'Branded API Health Check'
            env:
              API_HOSTNAME: $(apiHostname)
              BACKEND_DEFAULT_HOSTNAME: $(backendDefaultHostname)
