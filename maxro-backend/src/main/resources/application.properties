spring.application.name=maxro-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/maxro}
spring.data.mongodb.auto-index-creation=true

# JWT
maxro.jwt.secret=${JWT_SECRET}
maxro.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
maxro.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth
maxro.google.client-id=${GOOGLE_CLIENT_ID:}

# Google AI
maxro.google-ai.api-key=${GOOGLE_AI_API_KEY:}
maxro.google-ai.base-url=${GOOGLE_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
maxro.google-ai.model=${GOOGLE_AI_MODEL:gemini-2.5-flash}

# Spotify OAuth
maxro.spotify.client-id=${SPOTIFY_CLIENT_ID:}
maxro.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# USDA FoodData Central API
maxro.usda.api-key=${USDA_FOODDATA_API_KEY:}
maxro.usda.base-url=https://api.nal.usda.gov/fdc/v1

# FatSecret Platform API
maxro.fatsecret.client-id=${FATSECRET_CLIENT_ID:}
maxro.fatsecret.client-secret=${FATSECRET_CLIENT_SECRET:}
maxro.fatsecret.base-url=https://platform.fatsecret.com/rest/server.api
maxro.fatsecret.token-url=https://oauth.fatsecret.com/connect/token

# GraphQL
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.path=/graphql
spring.graphql.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.maxro=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.graphql=INFO
logging.level.org.springframework.security=INFO

# Server
server.port=${SERVER_PORT:8080}