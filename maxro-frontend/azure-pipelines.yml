trigger:
  branches:
    include:
      - main
  paths:
    include:
      - maxro-frontend/**

pool:
  name: 'Default'

variables:
  - group: maxro-secrets
  - name: appName
    value: 'maxro-frontend'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test Angular'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install Dependencies'
            workingDirectory: 'maxro-frontend'

          - script: npm run build -- --configuration=production
            displayName: 'Build Production'
            workingDirectory: 'maxro-frontend'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              pathToPublish: 'maxro-frontend/dist/maxro-frontend/browser'
              artifactName: 'frontend-build'

  - stage: Deploy
    displayName: 'Deploy to Azure Static Web Apps'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployFrontend
        displayName: 'Deploy Frontend'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - download: current
            artifact: frontend-build

          - script: >
              npx @azure/static-web-apps-cli@2.0.8 deploy
              "$(Pipeline.Workspace)/frontend-build"
              --deployment-token "$(SWA_DEPLOYMENT_TOKEN)"
              --env production
            displayName: 'Deploy to Static Web Apps'

          - powershell: |
              $swaUrl = 'https://$(SWA_HOSTNAME)'
              Write-Host ('Checking health at ' + $swaUrl)
              for ($i = 1; $i -le 10; $i++) {
                try {
                  $response = Invoke-WebRequest -Uri $swaUrl -UseBasicParsing -TimeoutSec 20
                  if ($response.StatusCode -eq 200) {
                    Write-Host 'Health check passed'
                    exit 0
                  }
                  $status = $response.StatusCode
                } catch {
                  if ($_.Exception.Response) {
                    $status = [int]$_.Exception.Response.StatusCode
                  } else {
                    $status = 'ERR'
                  }
                }
                Write-Host ('Attempt ' + $i + ': status ' + $status + ', retrying...')
                Start-Sleep -Seconds 5
              }
              Write-Host 'Health check failed'
              exit 1
            displayName: 'Health Check'
