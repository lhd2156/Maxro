spring.application.name=maxro-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/maxro}

# JWT
maxro.jwt.secret=${JWT_SECRET:supersecretkeythatisatleast256bitslong_change_in_production}
maxro.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
maxro.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth
maxro.google.client-id=${GOOGLE_CLIENT_ID:703359885202-fui8aof4l0ukh34e4pi16ckusi5fk61j.apps.googleusercontent.com}

# Spotify OAuth
maxro.spotify.client-id=${SPOTIFY_CLIENT_ID:}
maxro.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# Nutritionix API
maxro.nutritionix.app-id=${NUTRITIONIX_APP_ID:}
maxro.nutritionix.api-key=${NUTRITIONIX_API_KEY:}
maxro.nutritionix.base-url=https://trackapi.nutritionix.com/v2

# GraphQL
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.path=/graphql
spring.graphql.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.maxro=DEBUG
logging.level.org.springframework.graphql=INFO
logging.level.org.springframework.security=INFO

# Server
server.port=${SERVER_PORT:8080}


